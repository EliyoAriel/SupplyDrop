# SupplyDrop Configuration

# Drop Settings
drop:
  parachute:
    # Number of chickens to use for the parachute system
    chicken-count: 5
  particles:
    # Whether to show particle effects when the package lands
    landing-effects: true
    # Whether to show continuous particle effects while the package exists
    continuous-effects: true
    # Whether to show the flare effect when the package is dropped
    flare-effects: true
    smoke:
      # Whether to show the smoke trail effect
      enabled: false
      # Height of the smoke trail effect in blocks
      height: 20
    landing-zone:
      # Show a particle ring on the ground where the crate will land
      enabled: true
      # Radius of the ring in blocks
      radius: 3
      # Particle type for the ring
      particle: FLAME
  # How fast the crate falls when dropped (lower = slower, gives players more PvP time)
  falling-speed: 0.3
  # Fall duration in seconds (0 = use falling-speed, >0 = override falling-speed)
  fall-duration: 0
  # Whether to try avoiding claimed land when picking a drop target (requires LandClaim)
  avoid-claims: false
  # Height in blocks from which to drop the crate
  height: 20
  hologram:
    # Whether to show a floating text hologram above the crate
    enabled: true
    # Lines of text to display (supports & color codes)
    # Placeholders:
    #   {template}/{name} = display name, {x} = x coord, {z} = z coord
    #   {state} = crate state (FALLING, LOCKED, READY, etc.)
    #   {lock-progress} = lock phase visual progress bar
    #   {lock-time} = lock phase remaining time
    #   {team} = "TEAM CRATE" label, {team-required} = players needed
    #   {team-remaining} = players still needed, {team-progress} = visual progress bar
    #   {time} = expiry remaining time (shown when READY)
    lines:
      - "&b&l{template}"
      - "{team}"
      - "{team-progress}"
      - "{state}"
      - "{lock-progress}"
      - "{lock-time}"
      - "{time}"
      - "&7Right-click to open"

# Crate settings
crate:
  # Auto-destroy crate after this many ticks (0 = never, 12000 = 10 min)
  expiry: 1200
  # Anti-grief: protection radius around crate (blocks). 0 = disabled
  protection-radius: 2
  # Maximum active supplydrops (falling + landed). 0 = unlimited
  max-active: 30
  # Chance (%) for a crate to require multiple players to open (0 = never)
  team-open-chance: 0
  # Maximum random player count for team crate (2-64). Actual count is random between 2 and this value.
  team-open-range: 2
  # Chance (%) for a crate to be a trap (0 = disabled)
  trap-chance: 0
  # Mob types to spawn when trap crate is opened
  trap-mobs:
    - ZOMBIE
    - SKELETON
    - CREEPER
  # Lock phase: crate is locked for a duration after landing before it can be opened
  lock:
    # Whether the lock phase is enabled
    enabled: true
    # Fixed lock duration in ticks (used when random: false)
    duration: 200
    # Whether to use random lock duration between duration-min and duration-max
    random: false
    # Minimum lock duration in ticks (when random: true)
    duration-min: 100
    # Maximum lock duration in ticks (when random: true)
    duration-max: 400
    # Sound played when crate enters LOCK state
    sound-lock: "entity.iron_door.close"
    # Sound played when crate transitions to READY
    sound-ready: "entity.player.levelup"
    # Notify nearby players when crate becomes ready to open
    ready-notification: true
    # Radius in blocks to notify players
    ready-notification-radius: 20
    # What happens when barrel is broken during LOCK: "destroy" = items lost, "drop" = items drop
    break-behavior: "destroy"
    particle:
      # Show particles around barrel during LOCK
      enabled: true
      # Particle type
      type: ENCHANTMENT_TABLE
      # Radius around barrel
      radius: 1.5
  # Zone protection: prevents block interactions around locked/ready crates
  zone:
    # Whether zone protection is enabled
    enabled: true
    # Radius in blocks around crate (block place/break disabled inside)
    radius: 25
    # Particle type for the zone border
    particle: FLAME
    # Message shown when a player tries to build/break inside the zone
    deny-message: "&c&lSupply Drop &7- &fYou cannot build in the drop zone!"

# Loot rarity tiers (weights are relative, higher = more common)
rarity:
  common:
    weight: 60
    color: GRAY
    prefix: "&7"
  uncommon:
    weight: 25
    color: GREEN
    prefix: "&a"
  rare:
    weight: 10
    color: BLUE
    prefix: "&9"
  legendary:
    weight: 5
    color: GOLD
    prefix: "&6"

# How many items to roll per drop (min-max)
rolls:
  min: 3
  max: 6

# /supplydrop call settings
call:
  # Fall duration in seconds (0 = use global drop.fall-duration)
  fall-duration: 0

# /supplydrop spawn settings
spawn:
  # Fall duration in seconds (0 = use global drop.fall-duration)
  fall-duration: 0

# Announcement settings
announce:
  # Master toggle for all announcements
  enabled: true
  # Use actionbar instead of chat for announcements
  actionbar: false
  # Delay in ticks before revealing coordinates (0 = immediate)
  coord-reveal-delay: 0
  # Announcement tiers (normal, wave, chain, seasonal)
  # tiers:
  #   normal:
  #     prefix: "&b&lSupply Drop"
  #     message: "&e{template} &bincoming!"
  #     actionbar: false
  #   wave:
  #     prefix: "&6&l⚔ WAVE"
  #     message: "&e{count}x {template} &bincoming!"
  #     actionbar: false
  #   chain:
  #     prefix: "&c&l⛓ CHAIN"
  #     message: "&e{template} &bchain drop starting!"
  #     actionbar: true

# Auto-drop settings (world event)
auto-drop:
  # Master toggle for auto-drops
  enabled: false
  # Pause toggle - stops drops without disabling the scheduler
  paused: false
  # Use random interval between interval-min and interval-max
  random-interval: true
  # Interval between drops in ticks (72000 = 1 hour). Used when random-interval is false.
  interval: 72000
  # Random interval range in ticks (set interval > 0 to enable)
  interval-min: 36000
  interval-max: 72000
  # World to drop in
  world: "world"
  # Random radius from world spawn in blocks
  random-radius: 500
  # Fall duration in seconds (0 = use global drop.fall-duration)
  fall-duration: 0
  # Loot table templates for auto-drops (weighted — higher weight = more likely)
  templates:
    weapons:
      weight: 50
    armor:
      weight: 30
    supplies:
      weight: 20
  # Max crates per drop (random between 2 and this value). 1 = single drop always.
  wave-count: 1
  # Announce settings (inherits from global announce.* unless overridden here)
  announce: true
  announce-actionbar: false
  announce-delay: 100
  coord-reveal-delay: 0
  # Crate overrides: these override crate.* settings for auto-drops only.
  # 0 = use global crate.* setting (e.g. expiry:0 uses crate.expiry)
  # Leave at 0 to inherit global defaults, or set > 0 to override.
  expiry: 0
  team-crate-chance: 0
  team-crate-range: 2
  trap-chance: 0
  trap-mobs:
    - ZOMBIE
    - SKELETON
    - CREEPER
  # Loot scaling: bonus rolls based on time since last drop
  loot-scaling: false
  loot-scaling-max: 20
  # Player count scaling: adjust drop intensity based on online players
  scaling:
    enabled: false
    min-players: 1
    max-players: 20
    wave-min: 1
    wave-max: 5
    bonus-rolls-per-player: 0
  # Drop queuing: queue drops when sky is not clear
  queue:
    enabled: false
    poll-interval: 100
    max-queue-size: 5
  # Loot rotation: cycle through templates in order instead of weighted random
  rotation:
    enabled: false
  # Escalating difficulty: trap chance increases with consecutive undropped drops
  escalation:
    enabled: false
    increment: 5
    cap: 50
    reset-on-open: true
  # Scheduled drops: trigger at real-world times
  scheduled:
    enabled: false
    times: []
    # world-override: "world_nether"
  # Drop warnings: countdown before drops
  warning:
    enabled: false
    seconds-before:
      - 60
      - 30
      - 10
    message: "&e⚠ Supply drop in &c{seconds}s &e!"
  # Drop chains: sequential crates after a single auto-drop
  chain:
    enabled: false
    chance: 0
    count: 3
    interval: 1200
    decrease-interval: true
  # Seasonal events: override templates during specific date ranges
  # seasons:
  #   halloween:
  #     start: "10-15"
  #     end: "11-01"
  #     announce-prefix: "&6🎃"
  #     templates:
  #       spooky_loot:
  #         weight: 100

# Rewind integration: exclude crate chunks from Rewind's auto-restore while crates are active
rewind-integration:
  enabled: true
  exclusion-radius: 1

# Logging settings
logging:
  # Enables additional debug logs for troubleshooting
  debug: false

# UI theme settings
ui:
  chat:
    colors:
      primary: BLUE
      text: WHITE
      accent: AQUA
      success: GREEN
      warning: YELLOW
      error: RED
      error-detail: DARK_RED

# Notification settings
notification:
  # Whether players are subscribed by default (true = all players get notifications)
  default-subscribe: true
